# Aurora Sound Deck 音乐舱同源代理（网易云 / QQ 音乐 / LRCLIB 公开接口 + 短链解析）
# 由宝塔 extension 机制 include（/musicapi/ 前缀 ^~ 优先于正则 location）；删除本文件即回滚。
# 仅代理只读公开接口，不带任何账号凭据；浏览器同源访问，无 CORS 问题。

# —— 网易云 API ——
location ^~ /musicapi/netease/ {
    proxy_pass https://music.163.com/;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_set_header Host music.163.com;
    proxy_set_header Referer "https://music.163.com/";
    proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
    proxy_connect_timeout 15s;
    proxy_read_timeout 40s;
}

# —— QQ 音乐 API ——
location ^~ /musicapi/qq/ {
    proxy_pass https://c.y.qq.com/;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_set_header Host c.y.qq.com;
    proxy_set_header Referer "https://y.qq.com/";
    proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
    proxy_connect_timeout 15s;
    proxy_read_timeout 40s;
}

# —— LRCLIB 歌词 ——
location ^~ /musicapi/lrclib/ {
    proxy_pass https://lrclib.net/;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_set_header Host lrclib.net;
    proxy_set_header User-Agent "AuroraSoundDeck/0.7 (+https://mcdles.us.ci)";
    proxy_connect_timeout 15s;
    proxy_read_timeout 40s;
}

# —— 网易云短链解析（163cn.tv/xxx）——
# 302 的 Location 被改写回本站 /musicapi/netease/，浏览器 fetch 同源跟随，
# 最终 resp.url 即带 id 的落地地址（页面从中提取歌单/单曲 id）。
location ^~ /musicapi/short/163/ {
    proxy_pass http://163cn.tv/;
    proxy_set_header Host 163cn.tv;
    proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
    proxy_redirect https://music.163.com/ /musicapi/netease/;
    proxy_redirect http://music.163.com/ /musicapi/netease/;
    proxy_redirect https://m.music.163.com/ /musicapi/netease/;
    proxy_redirect http://m.music.163.com/ /musicapi/netease/;
    proxy_connect_timeout 10s;
    proxy_read_timeout 25s;
}

# —— QQ 音乐短链解析（c6.y.qq.com/base/fcgi-bin/u?__=…）——
location ^~ /musicapi/short/qq/ {
    proxy_pass https://c6.y.qq.com/;
    proxy_set_header Host c6.y.qq.com;
    proxy_set_header Referer "https://y.qq.com/";
    proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
    proxy_redirect https://i.y.qq.com/ /musicapi/qq/;
    proxy_redirect http://i.y.qq.com/ /musicapi/qq/;
    proxy_redirect https://y.qq.com/ /musicapi/qq/;
    proxy_redirect http://y.qq.com/ /musicapi/qq/;
    proxy_connect_timeout 10s;
    proxy_read_timeout 25s;
}

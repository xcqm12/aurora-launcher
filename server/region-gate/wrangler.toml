name = "aurora-region-gate"
main = "src/index.js"
compatibility_date = "2026-10-27"

[vars]
BLOCKED_COUNTRIES = "CN"
PATH_PREFIX = "/aurora"
# GitHub Release assets for the version you want to gate.
ORIGIN_BASE = "https://github.com/xcqm12/aurora-launcher/releases/download/v0.4.1/"

